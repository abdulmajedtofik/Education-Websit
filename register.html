
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | EduLearn</title>
  <link href="./src/output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-50">

  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="./index.html" class="text-2xl font-bold text-emerald-600">SMART</a>
      <a href="./index.html" class="text-gray-600 hover:text-emerald-600">← Back to Home</a>
    </div>
  </nav>

  <main class="min-h-[85vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-lg bg-white rounded-2xl shadow-xl p-8">

      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl mb-4">
          🎓
        </div>
        <h1 class="text-3xl font-bold text-gray-800">Create Account</h1>
        <p class="text-gray-500 mt-2">Join SMART and start learning today.</p>
      </div>

      <form id="registerForm" class="space-y-5">

        <div>
          <label for="fullName" class="block text-sm font-semibold mb-2">Full Name</label>
          <input
            type="text"
            id="fullName"
            required
            minlength="2"
            placeholder="Abdulmajed Tofik"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
          >
        </div>

        <div>
          <label for="registerEmail" class="block text-sm font-semibold mb-2">Email Address</label>
          <input
            type="email"
            id="registerEmail"
            required
            placeholder="abdulmajedtofik@gmail.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
          >
        </div>

        <div>
          <label for="registerPassword" class="block text-sm font-semibold mb-2">Password</label>
          <div class="relative">
            <input
              type="password"
              id="registerPassword"
              required
              minlength="8"
              placeholder="Create a password (at least 8 characters)"
              class="w-full px-4 py-3 pr-16 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
            >
            <button
              type="button"
              data-toggle-password="registerPassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-emerald-600 font-semibold"
            >Show</button>
          </div>
        </div>

        <div>
          <label for="confirmPassword" class="block text-sm font-semibold mb-2">Confirm Password</label>
          <div class="relative">
            <input
              type="password"
              id="confirmPassword"
              required
              minlength="8"
              placeholder="Enter your password again"
              class="w-full px-4 py-3 pr-16 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
            >
            <button
              type="button"
              data-toggle-password="confirmPassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-emerald-600 font-semibold"
            >Show</button>
          </div>
        </div>

        <div class="flex items-start gap-2">
          <input type="checkbox" id="terms" required class="w-4 h-4 mt-1 accent-emerald-600">
          <label for="terms" class="text-sm text-gray-600">
            I agree to the Terms and Conditions and Privacy Policy.
          </label>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition"
        >
          Create Account
        </button>

        <p id="registerMessage" class="text-sm text-center" role="status" aria-live="polite"></p>
      </form>

      <p class="text-center text-gray-600 text-sm mt-7">
        Already have an account?
        <a href="./login.html" class="text-emerald-600 font-bold hover:underline">Login</a>
      </p>

    </div>
  </main>

  <footer class="text-center py-5 text-sm text-gray-500">
    © 2026 SMART. All rights reserved.
  </footer>

  <script src="./src/js/auth.js"></script>
</body>
</html>
