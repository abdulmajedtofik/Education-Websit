
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | EduLearn</title>
  <link href="./src/output.css" rel="stylesheet">
</head>

<body class="min-h-screen bg-gray-50">

  <nav class="bg-white shadow-sm">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <a href="./index.html" class="text-2xl font-bold text-emerald-600">SMART</a>
      <a href="./index.html" class="text-gray-600 hover:text-emerald-600">← Back to Home</a>
            
    </div>
  </nav>

  <main class="min-h-[85vh] flex items-center justify-center px-4 py-12">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

      <div class="text-center mb-8">
        <div class="w-16 h-16 mx-auto bg-emerald-100 rounded-2xl flex items-center justify-center text-3xl mb-4">
          🎓
        </div>
        <h1 class="text-3xl font-bold text-gray-800">Welcome Back!</h1>
        <p class="text-gray-500 mt-2">Login to continue your learning journey.</p>
      </div>

      <form id="loginForm" class="space-y-5">

        <div>
          <label for="loginEmail" class="block text-sm font-semibold mb-2">Email Address</label>
          <input
            type="email"
            id="loginEmail"
            required
            placeholder="you@example.com"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500"
          >
        </div>

        <div>
          <div class="flex justify-between mb-2">
            <label for="loginPassword" class="text-sm font-semibold">Password</label>
            <a href="#" id="forgotPassword" class="text-sm text-emerald-600 hover:underline">Forgot password?</a>
          </div>

          <div class="relative">
            <input
              type="password"
              id="loginPassword"
              required
              minlength="8"
              placeholder="Enter your password"
              class="w-full px-4 py-3 pr-16 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-emerald-500"
            >
            <button
              type="button"
              data-toggle-password="loginPassword"
              class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-emerald-600 font-semibold"
            >Show</button>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <input type="checkbox" id="rememberMe" class="w-4 h-4 accent-emerald-600">
          <label for="rememberMe" class="text-sm text-gray-600">Remember me</label>
        </div>

        <button
          type="submit"
          class="w-full bg-emerald-600 text-white py-3 rounded-lg font-semibold hover:bg-emerald-700 transition"
        >
          Login
        </button>

        <p id="loginMessage" class="text-sm text-center" role="status" aria-live="polite"></p>
      </form>

      <div class="relative my-7">
        <div class="border-t border-gray-200"></div>
        <span class="absolute left-1/2 -translate-x-1/2 -top-3 bg-white px-3 text-sm text-gray-400">OR</span>
      </div>

      <p class="text-center text-gray-600 text-sm">
        Don't have an account?
        <a href="./register.html" class="text-emerald-600 font-bold hover:underline">Create Account</a>
      </p>

    </div>
  </main>

  <footer class="text-center py-5 text-sm text-gray-500">
    © 2026 SMART. All rights reserved.
  </footer>

  <script src="./src/js/auth.js"></script>
</body>
</html>
